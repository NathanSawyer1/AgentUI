name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v0.1.1-alpha.1"
        required: true
        type: string

jobs:
  linux-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CARGO_HOME: ${{ github.workspace }}/.rust/cargo
      RUSTUP_HOME: ${{ github.workspace }}/.rust/rustup
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check frontend and Rust
        run: npm run check

      - name: Run Rust tests
        run: npm run cargo:test

      - name: Build Linux bundles
        run: OPENCLAW_MOCK=1 npm run tauri:build

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          )
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No release artifacts found." >&2
            exit 1
          fi
          sha256sum "${artifacts[@]}" | tee SHA256SUMS.txt
          {
            echo "## SHA256 checksums"
            echo
            echo '```text'
            cat SHA256SUMS.txt
            echo '```'
          } > RELEASE_CHECKSUMS.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
          body_path: RELEASE_CHECKSUMS.md
          fail_on_unmatched_files: true
          files: |
            SHA256SUMS.txt
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
